NAME: HGG_Mitochondria_SimSiam

MODEL:
  pre_train: false
  pretrain_path: ./models/encoder.ckpt

TRAIN:
  resume: false
  cache_path: ./outputs/cache
  save_path: ./outputs/checkpoints
  display_freq: 100
  total_iters: 300000
  warmup_iters: 0
  base_lr: 0.0003
  end_lr: 0.0001
  save_freq: 1000
  decay_iters: 150000
  weight_decay: null
  power: 1.5
  batch_size: 12
  num_workers: 4
  if_cuda: true
  random_seed: 555

DATA:
  pointcloud_h5: ./data/mitochondrial_pointclouds.h5
  holdout_last_n: 16
